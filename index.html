<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>条码生成与播放</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 720px;
            margin: 30px auto;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ddd;
            border-radius: 4px;
            resize: vertical;
        }

        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 14px;
            font-size: 14px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #player-container {
            margin-top: 30px;
            text-align: center;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 6px;
            min-height: 180px;
        }

        #barcode-svg {
            max-width: 100%;
        }

        .player-info {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .player-buttons {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        #playBtn {
            background-color: #28a745;
        }

        #playBtn.playing {
            background-color: #dc3545;
        }

        #downloadBtn {
            background-color: #6c757d;
        }

        #batchDownloadBtn {
            background-color: #fd7e14;
        }

        #exportPdfBtn {
            background-color: #6f42c1;
        }

        #batchDownloadBtn:disabled,
        #exportPdfBtn:disabled {
            background-color: #ccc;
        }

        /* 进度弹窗 */
        #progressOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }

        #progressOverlay .progress-box {
            background: #fff;
            border-radius: 8px;
            padding: 30px 40px;
            text-align: center;
            min-width: 300px;
        }

        #progressOverlay .progress-box h3 {
            margin: 0 0 15px 0;
            color: #333;
        }

        #progressOverlay .progress-bar-bg {
            width: 100%;
            height: 20px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #progressOverlay .progress-bar-fill {
            height: 100%;
            background: #007bff;
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s;
        }

        #progressOverlay .progress-text {
            font-size: 14px;
            color: #666;
        }

        /* 隐藏的条码生成容器 */
        #hidden-container {
            position: absolute;
            left: -9999px;
            top: -9999px;
            width: 400px;
            height: 150px;
        }
    </style>
</head>
<body>

<h2>条码生成与播放</h2>

<div>
    <label>条码内容（每行一个）：</label>
    <textarea id="batchInput" placeholder="例如：&#10;SN20260507001&#10;SN20260507002&#10;SN20260507003"></textarea>
</div>

<div class="controls">
    <label>条码格式：</label>
    <select id="barcodeFormat">
        <option value="CODE128">CODE128</option>
        <option value="EAN13">EAN-13</option>
        <option value="UPC">UPC</option>
        <option value="CODE39">CODE39</option>
    </select>

    <label>播放间隔：</label>
    <input type="number" id="playInterval" value="1500" min="500" step="100" style="width: 80px;">
    <span>毫秒</span>

    <button onclick="generateAndPlay()">生成条码</button>
</div>

<div id="player-container">
    <svg id="barcode-svg"></svg>
    <div class="player-info" id="playerInfo">请先生成条码</div>
</div>

<div class="player-buttons">
    <button id="prevBtn" onclick="prevBarcode()" disabled>上一张</button>
    <button id="playBtn" onclick="togglePlay()" disabled>开始播放</button>
    <button id="nextBtn" onclick="nextBarcode()" disabled>下一张</button>
    <button id="downloadBtn" onclick="downloadCurrentBarcode()" disabled>下载当前</button>
    <button id="batchDownloadBtn" onclick="batchDownload()" disabled>批量下载 ZIP</button>
    <button id="exportPdfBtn" onclick="exportToPdf()" disabled>导出 PDF</button>
</div>

<!-- 进度弹窗 -->
<div id="progressOverlay">
    <div class="progress-box">
        <h3 id="progressTitle">正在生成条码...</h3>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBarFill"></div>
        </div>
        <div class="progress-text" id="progressText">0 / 0</div>
    </div>
</div>

<!-- 隐藏的条码生成容器 -->
<div id="hidden-container"></div>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script>
    let barcodeList = [];
    let currentIndex = 0;
    let playTimer = null;
    let isPlaying = false;

    // ============ 基础播放功能 ============

    function generateAndPlay() {
        stopPlay();

        const input = document.getElementById('batchInput').value.trim();
        const format = document.getElementById('barcodeFormat').value;

        if (!input) {
            alert('请输入条码内容');
            return;
        }

        barcodeList = input.split('\n').map(item => item.trim()).filter(item => item !== '');

        if (barcodeList.length === 0) {
            alert('没有有效条码内容');
            return;
        }

        currentIndex = 0;
        updateBarcode(format);

        document.getElementById('prevBtn').disabled = false;
        document.getElementById('nextBtn').disabled = false;
        document.getElementById('playBtn').disabled = false;
        document.getElementById('downloadBtn').disabled = false;
        document.getElementById('batchDownloadBtn').disabled = false;
        document.getElementById('exportPdfBtn').disabled = false;
    }

    function updateBarcode(format) {
        if (barcodeList.length === 0) return;

        const text = barcodeList[currentIndex];

        try {
            JsBarcode("#barcode-svg", text, {
                format: format,
                width: 2,
                height: 80,
                displayValue: true,
                fontSize: 16,
                textMargin: 8,
                margin: 10,
                background: "#ffffff",
                lineColor: "#000000"
            });

            document.getElementById('playerInfo').textContent =
                `第 ${currentIndex + 1} / ${barcodeList.length} 张：${text}`;
        } catch (e) {
            document.getElementById('playerInfo').textContent =
                `第 ${currentIndex + 1} / ${barcodeList.length} 张：${text}（生成失败）`;
        }
    }

    function prevBarcode() {
        stopPlay();
        if (barcodeList.length === 0) return;
        const format = document.getElementById('barcodeFormat').value;
        currentIndex = currentIndex > 0 ? currentIndex - 1 : barcodeList.length - 1;
        updateBarcode(format);
    }

    function nextBarcode() {
        stopPlay();
        if (barcodeList.length === 0) return;
        const format = document.getElementById('barcodeFormat').value;
        if (currentIndex >= barcodeList.length - 1) {
            setTimeout(() => {
                if (confirm("已到最后一张，是否重新播放？")) {
                    currentIndex = 0;
                    updateBarcode(format);
                }
            }, 100);
            return;
        }
        currentIndex++;
        updateBarcode(format);
    }

    function togglePlay() {
        isPlaying ? stopPlay() : startPlay();
    }

    function startPlay() {
        if (barcodeList.length <= 1) return;
        isPlaying = true;
        const playBtn = document.getElementById('playBtn');
        playBtn.textContent = "暂停";
        playBtn.classList.add("playing");

        const interval = Number(document.getElementById('playInterval').value) || 1500;
        const format = document.getElementById('barcodeFormat').value;

        playTimer = setInterval(() => {
            if (currentIndex >= barcodeList.length - 1) {
                stopPlay();
                setTimeout(() => {
                    if (confirm("已全部显示完成，是否重新播放？")) {
                        currentIndex = 0;
                        updateBarcode(format);
                        startPlay();
                    }
                }, 100);
                return;
            }
            currentIndex++;
            updateBarcode(format);
        }, interval);
    }

    function stopPlay() {
        isPlaying = false;
        clearInterval(playTimer);
        playTimer = null;
        const playBtn = document.getElementById('playBtn');
        playBtn.textContent = "开始播放";
        playBtn.classList.remove("playing");
    }

    // ============ 单张下载 ============

    function downloadCurrentBarcode() {
        if (barcodeList.length === 0) return;
        const svgElement = document.getElementById("barcode-svg");
        const text = barcodeList[currentIndex];
        if (!svgElement) return;

        try {
            const svgData = new XMLSerializer().serializeToString(svgElement);
            const svgBlob = new Blob([svgData], { type: "image/svg+xml;charset=utf-8" });
            const url = URL.createObjectURL(svgBlob);
            const link = document.createElement("a");
            link.href = url;
            link.download = `${text}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        } catch (e) {
            alert("下载失败，请重试");
        }
    }

    // ============ 工具函数：生成单个条码 SVG 字符串 ============

    function generateBarcodeSvg(text, format) {
        const hiddenContainer = document.getElementById('hidden-container');
        hiddenContainer.innerHTML = '';
        const hiddenSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        hiddenSvg.id = 'temp-barcode';
        hiddenContainer.appendChild(hiddenSvg);

        JsBarcode('#temp-barcode', text, {
            format: format,
            width: 2,
            height: 80,
            displayValue: true,
            fontSize: 16,
            textMargin: 8,
            margin: 10,
            background: "#ffffff",
            lineColor: "#000000"
        });

        const svgData = new XMLSerializer().serializeToString(hiddenSvg);
        hiddenContainer.innerHTML = '';
        return svgData;
    }

    // ============ 分批下载 ZIP ============

    async function batchDownload() {
        if (barcodeList.length === 0) {
            alert('请先生成条码');
            return;
        }

        const format = document.getElementById('barcodeFormat').value;
        const overlay = document.getElementById('progressOverlay');
        const barFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const progressTitle = document.getElementById('progressTitle');
        const total = barcodeList.length;

        // 分批大小：每批 100 条
        const BATCH_SIZE = 100;
        const batchCount = Math.ceil(total / BATCH_SIZE);

        overlay.style.display = 'flex';
        progressTitle.textContent = '正在生成条码...';

        try {
            for (let b = 0; b < batchCount; b++) {
                const zip = new JSZip();
                const imgFolder = zip.folder("barcodes");
                const start = b * BATCH_SIZE;
                const end = Math.min(start + BATCH_SIZE, total);
                const currentBatchSize = end - start;

                for (let i = start; i < end; i++) {
                    const text = barcodeList[i];

                    try {
                        const svgData = generateBarcodeSvg(text, format);
                        const safeName = text.replace(/[<>:"/\\|?*]/g, '_');
                        imgFolder.file(`${safeName}.svg`, svgData);
                    } catch (e) {
                        console.warn(`条码 "${text}" 生成失败，已跳过`);
                    }

                    // 更新进度
                    const percent = Math.round(((i + 1) / total) * 100);
                    barFill.style.width = `${percent}%`;
                    progressText.textContent = `${i + 1} / ${total}`;

                    if ((i + 1) % 10 === 0) {
                        await new Promise(resolve => setTimeout(resolve, 10));
                    }
                }

                // 生成当前批次的 ZIP
                progressText.textContent = `第 ${b + 1}/${batchCount} 批，正在打包...`;
                const content = await zip.generateAsync({ type: "blob" });

                const link = document.createElement("a");
                link.href = URL.createObjectURL(content);
                link.download = `barcodes_batch${b + 1}_${new Date().getTime()}.zip`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(link.href);

                // 每批之间暂停一下，让浏览器喘口气
                if (b < batchCount - 1) {
                    progressText.textContent = `第 ${b + 1} 批已下载，3秒后继续...`;
                    await new Promise(resolve => setTimeout(resolve, 3000));
                }
            }

            progressText.textContent = '全部下载完成！';
            setTimeout(() => { overlay.style.display = 'none'; }, 1500);

        } catch (e) {
            alert("批量下载失败：" + e.message);
            overlay.style.display = 'none';
        }
    }

    // ============ 导出 PDF（A4 一页多码，自动分页） ============

    async function exportToPdf() {
        if (barcodeList.length === 0) {
            alert('请先生成条码');
            return;
        }

        const format = document.getElementById('barcodeFormat').value;
        const overlay = document.getElementById('progressOverlay');
        const barFill = document.getElementById('progressBarFill');
        const progressText = document.getElementById('progressText');
        const progressTitle = document.getElementById('progressTitle');
        const total = barcodeList.length;

        overlay.style.display = 'flex';
        progressTitle.textContent = '正在生成 PDF...';
        barFill.style.width = '0%';
        progressText.textContent = `0 / ${total}`;

        try {
            const { jsPDF } = window.jspdf;
            // A4 纸张：210mm × 297mm
            const pdf = new jsPDF('p', 'mm', 'a4');
            const pageWidth = 210;
            const pageHeight = 297;
            const margin = 10;

            // 每行 3 个条码，每个条码宽 60mm，高 30mm
            const cols = 3;
            const barcodeW = 60;
            const barcodeH = 30;
            const gapX = (pageWidth - margin * 2 - barcodeW * cols) / (cols - 1);
            const gapY = 5;
            const rowsPerPage = Math.floor((pageHeight - margin * 2) / (barcodeH + gapY));

            let currentRow = 0;
            let currentCol = 0;
            let pageNum = 1;

            for (let i = 0; i < total; i++) {
                const text = barcodeList[i];

                // 生成条码 SVG
                const svgData = generateBarcodeSvg(text, format);
                const svgBase64 = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));

                // 计算位置
                const x = margin + currentCol * (barcodeW + gapX);
                const y = margin + currentRow * (barcodeH + gapY);

                // 如果当前页放不下，新增一页
                if (currentRow >= rowsPerPage) {
                    pdf.addPage();
                    pageNum++;
                    currentRow = 0;
                    currentCol = 0;
                }

                // 添加条码图片到 PDF
                pdf.addImage(svgBase64, 'SVG', x, y, barcodeW, barcodeH);

                // 在条码下方添加文字（条码内容）
                pdf.setFontSize(8);
                pdf.text(text, x + barcodeW / 2, y + barcodeH + 4, { align: 'center' });

                // 更新进度
                const percent = Math.round(((i + 1) / total) * 100);
                barFill.style.width = `${percent}%`;
                progressText.textContent = `${i + 1} / ${total}`;

                // 每 20 个让出主线程
                if ((i + 1) % 20 === 0) {
                    await new Promise(resolve => setTimeout(resolve, 10));
                }

                // 移动到下一个位置
                currentCol++;
                if (currentCol >= cols) {
                    currentCol = 0;
                    currentRow++;
                }
            }

            // 保存 PDF
            progressText.textContent = '正在保存 PDF...';
            pdf.save(`barcodes_${new Date().getTime()}.pdf`);

            progressText.textContent = 'PDF 导出完成！';
            setTimeout(() => { overlay.style.display = 'none'; }, 1500);

        } catch (e) {
            alert("PDF 导出失败：" + e.message);
            overlay.style.display = 'none';
        }
    }
</script>

</body>
</html>
